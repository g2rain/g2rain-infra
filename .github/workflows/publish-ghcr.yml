name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag, branch, notes, and project version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Expected a tag push, but got ref type '$GITHUB_REF_TYPE'." >&2
            exit 1
          fi
          tag_name="$GITHUB_REF_NAME"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable release tag: $tag_name" >&2
            exit 1
          fi

          version="${tag_name#v}"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $tag_name ($release_commit) is not contained in origin/main." >&2
            exit 1
          fi

          release_note="docs/releases/v${version}.md"
          if ! git cat-file -e "${release_commit}:${release_note}" 2>/dev/null || \
              [[ -z "$(git show "${release_commit}:${release_note}")" ]]; then
            echo "Missing or empty release note at $release_note in the tagged commit." >&2
            exit 1
          fi

          project_version="$(mvn --batch-mode --quiet -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$project_version" != "$version" ]]; then
            echo "Tag $tag_name does not match Maven project version $project_version." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "commit=$release_commit"
          } >> "$GITHUB_OUTPUT"
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both immutable release tags with Jib
        working-directory: g2rain-infra-startup
        env:
          IMAGE_NAME: ghcr.io/g2rain/g2rain-infra
          IMAGE_TAG: ${{ steps.release.outputs.version }}
          EXTRA_TAGS: sha-${{ steps.release.outputs.commit }}
        run: |
          args=()
          if [[ -n "$EXTRA_TAGS" ]]; then
            args+=("-Djib.to.tags=$EXTRA_TAGS")
          fi
          mvn --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=$IMAGE_NAME:$IMAGE_TAG" \
            "${args[@]}"
      - name: Report successful publication
        env:
          IMAGE: ghcr.io/g2rain/g2rain-infra
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          {
            echo '## GHCR publication succeeded'
            echo
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- \`${IMAGE}:sha-${RELEASE_COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-maven:
    needs: publish
    uses: ./.github/workflows/publish-maven.yml
    permissions:
      contents: read
      packages: write
